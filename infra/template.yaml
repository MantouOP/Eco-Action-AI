AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Eco-Action AI Backend

Resources:
  AppBedrockRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: BedrockAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - bedrock:InvokeModel
                  - bedrock:InvokeModelWithResponseStream
                Resource:
                  - arn:aws:bedrock:*::foundation-model/anthropic.claude-haiku-4-5-20251001-v1:0
                  - arn:aws:bedrock:*::foundation-model/amazon.nova-canvas-v1:0
                  - arn:aws:bedrock:*:*:inference-profile/global.anthropic.claude-haiku-4-5-20251001-v1:0

  AppApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      Cors:
        AllowMethods: "'POST, OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      WebsiteConfiguration:
        IndexDocument: index.html
      PublicAccessBlockConfiguration:
        BlockPublicAcls: false
        BlockPublicPolicy: false
        IgnorePublicAcls: false
        RestrictPublicBuckets: false

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"

  CarbonAnalysisFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: eco-action-carbon
      CodeUri: ../backend/lambda/carbon_analysis/
      Handler: run.sh
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  GreenAlternativesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: eco-action-alternatives
      CodeUri: ../backend/lambda/green_alternatives/
      Handler: run.sh
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  EcoExpertChatFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: eco-action-chat
      CodeUri: ../backend/lambda/eco_expert_chat/
      Handler: run.sh
      Runtime: python3.12
      Timeout: 60
      MemorySize: 256
      Role: !GetAtt AppBedrockRole.Arn
      Layers:
        - !Sub "arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:27"
      Environment:
        Variables:
          AWS_LAMBDA_EXEC_WRAPPER: /opt/bootstrap
          AWS_LWA_INVOKE_MODE: response_stream
          PORT: "8080"
      FunctionUrlConfig:
        AuthType: NONE
        InvokeMode: RESPONSE_STREAM

  EcoVisionFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: eco-action-vision
      CodeUri: ../backend/lambda/eco_vision/
      Handler: app.handler
      Runtime: python3.12
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt AppBedrockRole.Arn
      Events:
        ApiEvent:
          Type: Api
          Properties:
            RestApiId: !Ref AppApi
            Path: /ecovision
            Method: POST

Outputs:
  CarbonAnalysisUrl:
    Value: !GetAtt CarbonAnalysisFunctionUrl.FunctionUrl
  GreenAlternativesUrl:
    Value: !GetAtt GreenAlternativesFunctionUrl.FunctionUrl
  EcoExpertChatUrl:
    Value: !GetAtt EcoExpertChatFunctionUrl.FunctionUrl
  DiagramApiUrl:
    Value: !Sub "https://${AppApi}.execute-api.${AWS::Region}.amazonaws.com/prod/ecovision"
  BucketName:
    Value: !Ref FrontendBucket
  WebsiteUrl:
    Value: !GetAtt FrontendBucket.WebsiteURL
